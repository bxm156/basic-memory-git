version: '3.8'

services:
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.2.4
    container_name: git-sync
    environment:
      - GITSYNC_REPO=${GIT_REPO_URL}
      - GITSYNC_REF=${GIT_REF:-main}
      - GITSYNC_ROOT=/data/git
      - GITSYNC_LINK=current
      - GITSYNC_PERIOD=${SYNC_PERIOD:-60s}
      - GITSYNC_ONE_TIME=${ONE_TIME_SYNC:-false}
      # For private repos, uncomment and configure:
      # - GITSYNC_SSH_KEY_FILE=/etc/git-secret/ssh
      # - GITSYNC_SSH_KNOWN_HOSTS=false
    volumes:
      - docs-data:/data/git
      # For private repos with SSH key:
      # - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/etc/git-secret/ssh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-d", "/data/git/current"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  basic-memory:
    build:
      context: ./docker/basic-memory
      dockerfile: Dockerfile
    container_name: basic-memory
    depends_on:
      git-sync:
        condition: service_healthy
    environment:
      - HOME=/data/memory
      - DOCS_SUBPATH=${DOCS_SUBPATH:-.}
    volumes:
      - docs-data:/data/git:ro
      - memory-data:/data/memory
    ports:
      - "${MCP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  docs-data:
    driver: local
  memory-data:
    driver: local
