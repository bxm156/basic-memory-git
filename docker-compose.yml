version: '3.8'

services:
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.5.0
    container_name: git-sync
    environment:
      - GITSYNC_REPO=${GIT_REPO_URL}
      - GITSYNC_REF=${GIT_REF:-main}
      - GITSYNC_ROOT=/data/git
      - GITSYNC_LINK=current
      - GITSYNC_PERIOD=${SYNC_PERIOD:-60s}
      - GITSYNC_ONE_TIME=${ONE_TIME_SYNC:-false}
      # For sparse checkout (only clone specific paths):
      # - GITSYNC_SPARSE_CHECKOUT_FILE=/etc/git-sync/sparse-checkout
      # For private repos:
      # - GITSYNC_SSH_KEY_FILE=/etc/git-secret/ssh
      # - GITSYNC_SSH_KNOWN_HOSTS=false
    volumes:
      - docs-data:/data/git
      # For sparse checkout, mount your sparse-checkout file:
      # - ./sparse-checkout:/etc/git-sync/sparse-checkout:ro
      # For private repos with SSH key:
      # - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/etc/git-secret/ssh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-d", "/data/git/current"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  git-crypt-unlock:
    build: ./git-crypt
    container_name: git-crypt-unlock
    depends_on:
      git-sync:
        condition: service_healthy
    environment:
      - ENABLE_GIT_CRYPT=${ENABLE_GIT_CRYPT:-false}
      - GIT_CRYPT_KEY_PATH=/secrets/git-crypt-key
    volumes:
      - docs-data:/data/git  # Read-write to decrypt files in place
      # Mount your git-crypt symmetric key file:
      # Generate with: git-crypt export-key /path/to/git-crypt-key
      - ${GIT_CRYPT_KEY_PATH:-/dev/null}:/secrets/git-crypt-key:ro
    restart: on-failure

  basic-memory:
    build: ./basic-memory
    container_name: basic-memory
    depends_on:
      git-sync:
        condition: service_healthy
      git-crypt-unlock:
        condition: service_completed_successfully
    environment:
      - HOME=/data/memory
      - DOCS_SUBPATH=${DOCS_SUBPATH:-.}
    volumes:
      - docs-data:/data/git:ro
      - memory-data:/data/memory
    ports:
      - "${MCP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  docs-data:
    driver: local
  memory-data:
    driver: local
